name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run ptkg -- validate fixtures/cgroup-golden
      - run: npm run ptkg -- authoring-validate fixtures/authoring/cgroup-golden
      - run: npm run ptkg -- course-compile fixtures/authoring/cgroup-golden --out ci-course
      - run: npm run ptkg -- course-validate ci-course --profile draft
